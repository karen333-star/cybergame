<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGame - Registro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
        function validarContraseña(password) {
            const regex = /^(?=.*[A-Z])(?=.*\d).{7,}$/;
            return regex.test(password);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm_password');
            const registerForm = document.getElementById('registerForm');

            passwordInput.addEventListener('input', function() {
                const mensaje = document.getElementById('passwordHelp');
                if (this.value && !validarContraseña(this.value)) {
                    mensaje.textContent = '❌ Mínimo 7 caracteres, 1 mayúscula y 1 número';
                    mensaje.style.color = '#ff6b6b';
                } else if (this.value) {
                    mensaje.textContent = '✓ Contraseña válida';
                    mensaje.style.color = '#51cf66';
                }
            });

            registerForm.addEventListener('submit', function(e) {
                if (passwordInput.value !== confirmInput.value) {
                    e.preventDefault();
                    alert('Las contraseñas no coinciden');
                    return;
                }

                if (!validarContraseña(passwordInput.value)) {
                    e.preventDefault();
                    alert('La contraseña debe tener mínimo 7 caracteres, 1 mayúscula y 1 número');
                    return;
                }
            });
        });
    </script>
</head>
<body class="register-page">
    <div class="register-grid-overlay" aria-hidden="true"></div>
    <div class="container register-shell">
        <h1 id="main-title"><span class="brand-shield">◬</span> CYBER_GAME</h1>
        
        <div class="card register-card">
            <div class="corner corner-tl" aria-hidden="true"></div>
            <div class="corner corner-tr" aria-hidden="true"></div>
            <div class="corner corner-bl" aria-hidden="true"></div>
            <div class="corner corner-br" aria-hidden="true"></div>

            <h2>Registrarse</h2>
            
            <form id="registerForm" method="POST" action="register.php">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrap">
                        <span class="input-icon input-icon-mail" aria-hidden="true"></span>
                        <input type="email" id="email" name="email" required placeholder="example@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="nombre_usuario">Nombre de Usuario</label>
                    <div class="input-wrap">
                        <span class="input-icon input-icon-user" aria-hidden="true"></span>
                        <input type="text" id="nombre_usuario" name="nombre_usuario" required placeholder="karen_white99">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrap">
                        <span class="input-icon input-icon-lock" aria-hidden="true"></span>
                        <input type="password" id="password" name="password" required placeholder="••••••••••••••••">
                        <span class="input-trail" aria-hidden="true"></span>
                    </div>
                    <small id="passwordHelp" style="display: block; margin-top: 5px;"></small>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmar Contraseña</label>
                    <div class="input-wrap input-wrap-success">
                        <span class="input-icon input-icon-check" aria-hidden="true"></span>
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••••••••••">
                        <span class="input-ok" aria-hidden="true"></span>
                    </div>
                </div>

                <button type="submit" class="btn">Registrarse</button>
            </form>

            <p class="toggle-text">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>

        <div id="errorDiv" style="display: none; color: #ff6b6b; text-align: center; margin-top: 20px;"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) {
            const errorDiv = document.getElementById('errorDiv');
            errorDiv.textContent = params.get('error');
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
