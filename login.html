<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGame - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="main-title">🛡️ CyberGame</h1>
        
        <div class="card">
            <h2>Iniciar Sesión</h2>
            
            <form id="loginForm" method="POST" action="login.php">
                <div class="form-group">
                    <label for="identidad">Correo o Usuario:</label>
                    <input type="text" id="identidad" name="identidad" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn">Iniciar Sesión</button>
            
            <p class="toggle-text" style="margin-top: 15px;">
                <a href="forgot.html" style="color: #ff6b6b; cursor: pointer;">¿Olvidaste tu contraseña?</a>
            </p>
            </form>

            <p class="toggle-text">
                ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
            </p>
        </div>

        <div id="error-message" style="color: #ff6b6b; text-align: center; margin-top: 20px;"></div>
    </div>

    <script>
        (function mostrarErrorDesdeURL() {
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            if (!error) return;

            const errorElement = document.getElementById('error-message');
            errorElement.textContent = error;
        })();
    </script>
</body>
</html>
